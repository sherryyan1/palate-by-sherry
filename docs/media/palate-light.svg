  <title id="title">palate. by Sherry</title>
  <desc id="description">Good research deserves good taste. Not just how it looks. How it thinks.</desc>
  <rect width="1200" height="480" rx="24" fill="#F7F9F9"/>
  <g text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
