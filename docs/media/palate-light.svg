    <text x="600" y="242" font-size="23" letter-spacing="1.2" fill="#58686C">by Sherry</text>
    <text x="600" y="323" font-size="31" font-weight="500" letter-spacing="-0.5" fill="#172B30">Good research deserves good taste.</text>
    <text x="600" y="367" font-size="22" fill="#58686C">Not just how it looks. How it thinks.</text>
  </g>
  <g transform="translate(538 414)">
